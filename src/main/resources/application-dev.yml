spring:
  datasource:
    url: jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate # Flyway gerencia o schema
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    br.com.passos: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
